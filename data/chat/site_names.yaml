# P13 / R14: names the chat model may not use in free text on any turn. Sites belong to the list.
#
# The guard DERIVES most names: every word of 3+ letters in data/sites/sites.yaml names, operators,
# ownership detail and towns ("Saugus" catches "the Saugus one"), minus `generic_words` below.
# This file only holds what derivation cannot know:
#   aliases          short forms and multi-word names people and models use
#   generic_words    ordinary words that appear in site names but must stay usable in a sentence
#   capitalized_only words that are a place name only when capitalized (matched case-sensitively)
# Not clinical content. A false positive costs one retry, then fixed copy with the same chips.
