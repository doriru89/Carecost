          with persistent or progressive symptoms during or following 6 weeks of optimal medical management. Initial
          imaging.
        requires_prior_radiographs: false
        ratings:
          MRI lumbar spine without IV contrast: UA
          Radiography lumbar spine: MBA
      4:
        description: Low back pain with suspected cauda equina syndrome. Initial imaging.
        requires_prior_radiographs: false
        ratings:
          MRI lumbar spine without IV contrast: UA
          Radiography lumbar spine: UNA
      5:
        description: Low back pain with history of prior lumbar surgery and with or without radiculopathy. New or
          progressing symptoms or clinical findings. Initial imaging.
        requires_prior_radiographs: false
        ratings:
          Radiography lumbar spine: UA
          MRI lumbar spine without IV contrast: UA
      6:
        description: 'Low back pain with or without radiculopathy. One or more of the following: low-velocity trauma,
