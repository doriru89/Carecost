    recheck_after_days: 365
    fetched_text_sha256: ac2a82dfd5cbe064c3660aab2e57ad7aa4c635b370dbb2208555feb75362ab0b
    excerpts:
    - Patient meets the requirements for evaluation by the Ottawa Ankle Rules which are positive
    - Ottawa Ankle Rules which are negative
    - Inability to bear weight immediately after the injury
    - Acute trauma to the ankle with persistent pain for more than 1 week
    acr_variants:
      1:
        description: 'Adult or child 5 years of age or older. Acute trauma to the ankle or acute trauma to the ankle
          with persistent pain for more than 1 week but less than 3 weeks. No exclusionary criteria present. Initial
          imaging. Patient meets the requirements for evaluation by the Ottawa Ankle Rules which are positive: 1.
          Inability to bear weight immediately after the injury, OR 2. Point tenderness over the medial malleolus,
          the posterior edge or inferior tip of the lateral malleolus, talus, or calcaneus, OR 3. Inability to ambulate
          for 4 steps in the emergency department.'
        requires_prior_radiographs: false
        ratings:
          Radiography ankle: UA
          MRI ankle without IV contrast: UNA
      2:
        description: 'Adult or child 5 years of age or older. Acute trauma to the ankle. No exclusionary criteria
          present (eg, neurologically intact (including no peripheral neuropathy)). Patient meets the requirements
          for evaluation by the Ottawa Ankle Rules which are negative: No point tenderness over the malleoli, talus,
          or calcaneus on physical examination. Able to walk. Initial imaging.'
        requires_prior_radiographs: false
        ratings:
          Radiography ankle: UNA
          MRI ankle without IV contrast: UNA
      3:
        description: Adult or child 5 years of age or older. Acute trauma to the ankle. Exclusionary criteria are
          present (eg, neurologic disorder, neuropathy, or other). Patient does not meet requirements for evaluation
          by the Ottawa Ankle Rules. Initial imaging.
        requires_prior_radiographs: false
        ratings:
          Radiography ankle: UA
          MRI ankle without IV contrast: UNA
      4:
        description: Adult or child 5 years of age or older. Acute trauma to the ankle with persistent pain for
          more than 1 week but less than 3 weeks. No exclusionary criteria present. Initial radiographs negative.
          Next study.
        requires_prior_radiographs: true
        ratings:
          MRI ankle without IV contrast: UA
          Radiography ankle: MBA
      5:
        description: Adult or child 5 years of age or older. Acute trauma to the ankle. No exclusionary criteria
          present. Radiographs demonstrate fracture or potential osteochondral injury. Next study.
        requires_prior_radiographs: true
        ratings:
          MRI ankle without IV contrast: UA
      6:
        description: Adult or child 5 years of age or older. Acute trauma to the ankle. Radiographs negative for
          osseous injury and physical examination or radiographs demonstrate alignment abnormality suggesting syndesmotic/ligamentous
          injury or dislocation. Next study.
        requires_prior_radiographs: true
        ratings:
          MRI ankle without IV contrast: UA
