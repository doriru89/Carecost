          Radiography lumbar spine: MBA
  acr_acute_ankle_2020:
    title: 'ACR Appropriateness Criteria: Acute Trauma to the Ankle'
    publisher: American College of Radiology
    year: 2020
    url: https://acsearch.acr.org/docs/69436/Narrative/
