    fetched_text_sha256: 122b8c2d48350920df68fc68f121ecac4075bac7cea3b138be0e91dee1ff2284
    excerpts:
    - Abdominal pain is pain that you feel anywhere between your chest and groin.
    - Almost everyone has pain in the abdomen at some point.
    - Most of the time, it is not serious.
    - Get medical help right away or call 911 or the local emergency number if you
    - Have tenderness in your belly, or your belly is rigid and hard to the touch
    - Are pregnant or could be pregnant
    - Fever, over 100°F (37.7°C) for adults or 100.4°F (38°C) for children, with pain
    - Abdominal pain that does not improve in 24 to 48 hours
    - Your provider will perform a physical exam and ask about your symptoms and medical history.
    - the location of pain and when it occurs will help your provider detect the cause
    - Blood, urine, and stool tests
    - Ultrasound of the abdomen
    - Colonoscopy or sigmoidoscopy (tube through the rectum into the colon)
