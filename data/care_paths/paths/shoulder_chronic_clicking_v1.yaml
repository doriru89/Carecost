- id: mr_arthrogram
  layer: 2
  parent: visit
  after:
  - visit
  - xray
  kind: imaging
  appropriateness:
    rating: UA
    source: acr_chronic_shoulder_2022
    variant: 4
    procedure: MR arthrography shoulder
  likelihood_tier: rare
  plain:
    name: Detailed scan with dye in the joint
    technical_name: Shoulder MR arthrogram
    what: A doctor first injects dye into the joint, using a live X-ray to guide the needle, and then you have the
      detailed magnet scan.
    why: The dye seeps into small tears, so it shows damage to the cartilage rim around the socket (the labrum)
      better. It's used when clicking comes with catching or a slipping feeling.
    when_skipped: There's no catching or slipping, or a plain detailed scan already answered the question.
  citations:
