clinical_uncertainties:
- ACR's document does not use the word 'clicking'. Mapping painful click/catch to the labral/instability variant
  (V4) is an inference.
- Q6 (can lift with help vs stiff both ways) stands in for the active vs passive range-of-motion exam; a clinician
  should confirm it is reliable enough to move tiers.
- Tier 'likely' for imaging after 6 weeks of failed treatment is our judgment, not a measured frequency.
- Whether frozen shoulder should be its own path (ACR V5) or stay a modifier here is Austin's call.
- PT 'likely' extends AAOS's strong recommendation for full-thickness tears to cuff-type chronic pain in general.
