id: shoulder_chronic_clicking_v1
version: 1.0.0
title:
  en: Shoulder pain that came on gradually, often with painful clicking
  zh: 慢慢出现的肩痛，常伴有疼痛的咔哒声
intro: Shoulder pain that builds up slowly, sometimes with clicking that hurts, usually comes from the tendons that
  lift your arm (the rotator cuff). Less often it's the rim of cartilage around the socket. Most people start with
  an exam and a quick bone picture, then exercises. Detailed scans come later, and only if needed.
