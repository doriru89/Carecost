    source: acr_chronic_shoulder_2022
    variant: 2
    procedure: Image-guided anesthetic +/- corticosteroid injection shoulder or surrounding structures
  likelihood_tier: possible
  plain:
    name: Shot of anti-inflammatory and numbing medicine
    technical_name: Corticosteroid shoulder injection
    what: A needle puts anti-inflammatory medicine mixed with numbing medicine into or near the shoulder joint,
      sometimes guided by ultrasound.
    why: It can calm the pain for a while so you can do your exercises. Guidelines say a single shot can be considered
      for short-term relief.
    when_skipped: The pain is mild enough to do the exercises without it, or you'd rather avoid shots.
  when_skipped_basis: logic
  reviewer_note: Diabetes / blood-sugar concerns and nearness to surgery change this; doctor decides.
