clinical_uncertainties:
- 'Dyspepsia (upper-belly pain without heartburn) uses a different rule (ACG/CAG 2017: scope at 60+, H. pylori test-and-treat
  under 60) that is NOT modeled; it was not snapshotted.'
- 00731 and 43235 were not verified against the research list; mapping marked asserted.
