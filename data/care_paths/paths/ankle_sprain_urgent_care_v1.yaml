# CPT codes appear only under `cpts` (price layer). Edit freely, then run backend tests.
id: ankle_sprain_urgent_care_v1
version: 1.0.0
title:
  en: Twisted or sprained ankle (urgent care)
  zh: 扭伤的脚踝（urgent care）
intro: Most twisted ankles are sprains, a stretched or torn ligament. At urgent care, a short exam using a well-tested
  checklist (the Ottawa ankle rules) decides whether you need a bone picture. Most sprains heal with rest, ice,
  a wrap and, later, exercises.
scope:
  area: msk_ankle
  acuity: acute
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - ankle
    Q2:
    - injury
red_flags:
- rf_cardiac
- rf_chest_pain_alone
- rf_suicide_self_harm
- rf_overdose
- rf_breathing
- rf_breathing_mild
- rf_stroke
- rf_thunderclap_headache
- rf_unresponsive_seizure
- rf_allergic_airway
- rf_non_blanching_rash
- rf_septic_joint
- rf_limb_deformity
- rf_systemic_msk
