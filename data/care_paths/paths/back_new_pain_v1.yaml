- id: visit
  layer: 1
  parent: referral
  kind: visit
  appropriateness:
    rating: standard_of_care
    note: History/exam for red flags decides the ACR variant; the visit is not rated.
  likelihood_tier: certain
  plain:
    name: Visit with your doctor about the back pain
    technical_name: Primary-care or urgent-care visit
    what: The doctor asks about the pain and checks your back, legs and reflexes for warning signs.
    why: The exam rules out the rare serious causes and sets a plan of activity, medicine and exercise.
    when_skipped: It isn't skipped on this path.
  when_skipped_basis: logic
  reviewer_note: Primary care vs. specialist as first visit depends on plan and person.
  citations:
  - doc: acr_low_back_pain_2021
    year: 2021
