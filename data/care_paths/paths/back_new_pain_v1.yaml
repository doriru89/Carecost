    mapping: confirmed_pfs
  - code: '99204'
    role: alternative
    mapping: confirmed_pfs
- id: physical_therapy
  layer: 2
  parent: visit
  after:
  - visit
  kind: therapy
  appropriateness:
    rating: standard_of_care
    note: Activity and exercise are first-line; formal PT is optional early on.
  likelihood_tier: possible
  plain:
    name: Guided exercise program for the back
    technical_name: Physical therapy evaluation and visits
    what: A first session where a therapist checks your strength and motion, then guided exercises over several
      weeks.
    why: Exercise is the usual first treatment for this kind of pain and is tried before any detailed scan.
    when_skipped: The pain settles with home exercises, or the exam shows something that needs a surgeon first.
  when_skipped_basis: logic
  reviewer_note: Visit count varies; price as evaluation + per-visit.
