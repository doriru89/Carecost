id: back_new_pain_v1
version: 1.0.0
title:
  en: New low back pain without warning signs
  zh: 新近出现、没有报警症状的腰痛
intro: Most new low back pain gets better on its own within a few weeks. Without warning signs, guidelines say scans
  in the first weeks don't help, so the main cost is usually one visit and maybe some guided exercise.
scope:
  area: msk_back
  acuity: acute
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - lower_back
  any_of:
  - Q3:
    - lt_6w
  - Q4:
    - 'no'
red_flags:
- rf_cardiac
- rf_chest_pain_alone
- rf_suicide_self_harm
- rf_overdose
- rf_breathing
- rf_breathing_mild
- rf_stroke
- rf_thunderclap_headache
- rf_unresponsive_seizure
- rf_head_injury_serious
- rf_head_injury_vomiting
- rf_palpitations_faint
- rf_child_limp
