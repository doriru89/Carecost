clinical_uncertainties:
- Biopsy technique preference (narrow excision with 1-3 mm margins for suspected melanoma) comes from the AAD 2019
  guideline via secondary summaries; the primary JAAD text was not read.
- Excision codes (11400/11600 series) depend on final pathology and size; the sizes shown are placeholders.
- How often a changing mole is sampled vs watched is not measured; 'likely' assumes the entry criteria (new/changing/different/bleeding).
