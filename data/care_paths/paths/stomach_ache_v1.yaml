- id: urine_test
  layer: 2
  parent: visit
  after:
  - visit
  kind: lab
  appropriateness:
    rating: standard_of_care
    note: Urine testing is among the first tests listed for belly pain (MedlinePlus, NHS).
  likelihood_tier: likely
  plain:
    name: Urine test
    technical_name: Urinalysis (dipstick, automated)
    what: You give a small urine sample that is checked for signs of infection, blood or other changes.
    why: A bladder or kidney problem can feel like belly pain, and a urine test is a quick way to check.
    when_skipped: The exam already points clearly to a cause that needs no test.
  when_skipped_basis: logic
  reviewer_note: '[我判断] Tier likely, not certain: a quick, common first test at urgent care; sources only say it
