    note: Blood tests are listed among the tests that may be done for belly pain.
  likelihood_tier: possible
  plain:
    name: Blood tests
    technical_name: Complete blood count and metabolic panel
    what: A small blood sample is checked for signs of infection or inflammation and for how your liver and kidneys
