# AI-drafted care path. NOT publishable until two non-AI reviewers sign off (review.status).
# Plain text is our own words; quotes are <=15 words and verified against data/care_paths/sources.yaml.
# CPT codes appear only under `cpts` (price layer). Edit freely, then run backend tests.
# R19 / P12 (2026-10-25): "stomach ache" / "belly pain" / 肚子疼 as a person says it. First visit at urgent care or
# a primary-care office, then likely / possible tests. Routes out to the heartburn and bowel paths (exits).
id: stomach_ache_v1
version: 1.0.0
title:
  en: Stomach ache or belly pain without warning signs
  zh: 没有报警症状的肚子疼（腹痛）
intro: Most stomach aches are not serious and settle on their own. If yours doesn't, a first visit at urgent care
  or a primary care office starts with questions and a gentle press on your belly. A urine test is common; blood
  tests or a picture of the belly come only sometimes.
