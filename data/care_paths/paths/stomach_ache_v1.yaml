- id: belly_ct
  layer: 2
  parent: visit
  after:
  - visit
  kind: imaging
  appropriateness:
    rating: standard_of_care
    note: Listed among the tests for belly pain; no ACR variant was snapshotted for this path.
  likelihood_tier: possible
  plain:
    name: Detailed scan of the belly
    technical_name: CT of the abdomen and pelvis with contrast
    what: You lie on a table that slides through a ring-shaped scanner. Dye through a vein often helps the organs
      show up.
    why: When the cause is still unclear after the exam and tests, a detailed scan can show what an exam can't.
    when_skipped: The exam, simple tests or a sound-wave picture already explain the pain.
  when_skipped_basis: logic
  reviewer_note: '[我判断] Possible, not rare: common when belly pain stays unexplained, but done at a hospital or
