  likelihood_tier: possible
  plain:
    name: Pregnancy test
    technical_name: Urine pregnancy test
    what: The same urine sample can be checked for pregnancy.
    why: If there is any chance of pregnancy, doctors check, because it changes which causes and tests come next.
    when_skipped: There is no chance you could be pregnant.
  when_skipped_basis: logic
  reviewer_note: Not asked in the questions (no sex or age question on this path), so it stays possible for everyone.
  citations:
