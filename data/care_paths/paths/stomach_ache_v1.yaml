  likelihood_tier: possible
  plain:
    name: Sound-wave picture of the belly
    technical_name: Abdominal ultrasound
    what: Gel and a handheld probe on your belly make pictures of organs such as the gallbladder, liver and kidneys.
      No radiation.
    why: If the exam points to a specific organ, a picture helps check it.
    when_skipped: The exam and simple tests already explain the pain.
  when_skipped_basis: logic
  reviewer_note: Usually done at a hospital or imaging center, not at urgent care.
  citations:
  - doc: medlineplus_abdominal_pain
    year: 2026
