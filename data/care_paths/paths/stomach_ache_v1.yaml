clinical_uncertainties:
- Test tiers (urine likely; pregnancy, blood, ultrasound and CT possible) are judgment from MedlinePlus/NHS lists, not
  a rated guideline. No ACR variant for nonlocalized or right-lower-quadrant pain was snapshotted.
- No question separates upper, lower or one-sided pain, so every possible test applies to everyone.
- Stool tests and a lipase blood test are not modeled.
- Urgent cares that bill one flat visit code (for example S9083) are not modeled on this path.
