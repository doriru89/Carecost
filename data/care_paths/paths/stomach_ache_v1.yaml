    note: History and a belly exam are the first step for belly pain; the visit itself is not rated.
  likelihood_tier: certain
  plain:
    name: First visit about the belly pain
    technical_name: Urgent-care or primary-care office visit
    what: A clinician asks where it hurts, how it started and what makes it better or worse, then presses gently on
      your belly.
    why: Where the pain is and how it behaves point to the likely cause and decide whether any test is needed.
    when_skipped: Pain that is mild and clearly getting better often settles at home without a visit.
  when_skipped_basis: clinical
