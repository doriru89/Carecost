exits:
- when: The pain is mainly burning in the upper belly or chest after meals
  text: That fits the heartburn path better. Answer again and choose heartburn or upper-belly pain.
  citations:
  - doc: nhs_stomach_ache
    year: 2026
    section: Common causes of stomach ache
    url: https://www.nhs.uk/conditions/stomach-ache/
    quote: Feeling full and bloated after eating, heartburn, feeling sick
    claim_field: intro
- when: The pain comes with changes in your bowel habits or blood in your stool
  text: Answer again and choose bowel changes or blood in stool. That path covers the colon check.
  citations:
  - doc: nhs_stomach_ache
    year: 2026
    section: Common causes of stomach ache
    url: https://www.nhs.uk/conditions/stomach-ache/
    quote: Finding it hard to poo, or not pooing as often
    claim_field: intro
- when: The doctor finds a cause that needs a hospital or a specialist
  text: This tool stops here. Treatment in a hospital or by a specialist is priced differently.
