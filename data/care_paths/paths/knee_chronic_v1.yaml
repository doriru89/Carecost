id: knee_chronic_v1
version: 1.0.0
title:
  en: Knee pain that came on gradually
  zh: 慢慢出现的膝盖痛
intro: Knee pain that builds up over time is most often wear of the cartilage (arthritis), or a problem with a tendon
  or the knee's cushion cartilage. Most people start with an exam and a quick bone picture, then exercises. A detailed
  scan comes later, mainly if the knee catches or locks.
scope:
  area: msk_knee
  acuity: chronic
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - knee
    Q2:
    - no_injury
