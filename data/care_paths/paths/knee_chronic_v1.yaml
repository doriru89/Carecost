  likelihood_tier: possible
  plain:
    name: Detailed scan of the knee's soft parts
    technical_name: Knee MRI (no contrast)
    what: A strong magnet makes detailed pictures of cartilage, ligaments and tendons. You lie still with the knee
      inside the machine.
    why: After an X-ray, if the exam suggests a torn cushion cartilage, ligament or tendon, this shows it directly.
    when_skipped: The X-ray shows ordinary arthritis; then a detailed scan usually adds little.
