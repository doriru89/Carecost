  kind: visit
  appropriateness:
    rating: standard_of_care
    note: ACR knee variants are defined by what the exam suspects; the visit is not rated.
  likelihood_tier: certain
  plain:
    name: Visit with a bone & joint doctor
    technical_name: New-patient orthopedic or sports-medicine visit
    what: The doctor asks how the pain behaves and presses and bends the knee to test the cartilage, ligaments and
      tendons.
    why: The exam points to arthritis, a tendon problem or a cartilage tear, and that decides what comes next.
    when_skipped: It isn't skipped on this path.
  when_skipped_basis: logic
