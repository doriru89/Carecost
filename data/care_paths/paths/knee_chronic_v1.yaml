- ACR Chronic Knee Pain was revised in 2026; the variant ratings were re-read 2026-10-24 but the narrative changes
  were not reviewed.
- PT 'likely' rests on general rehab sources here; the AAOS knee osteoarthritis guideline was not snapshotted.
- 73721 (knee MRI) exists in the PFS but was not in the research list; mapping marked asserted.
