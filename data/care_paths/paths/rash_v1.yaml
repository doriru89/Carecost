steps:
- id: visit
  layer: 1
  kind: visit
  appropriateness:
    rating: standard_of_care
    note: Looking at the rash and asking about its history is the first step; the visit itself is not rated.
  likelihood_tier: certain
  plain:
    name: First visit about the rash
    technical_name: Urgent-care, primary-care or dermatology office visit
    what: A clinician looks at the rash and asks when it started, what touched your skin and whether you started a
      new medicine.
    why: How a rash looks, where it is and what came before it usually show the cause.
    when_skipped: A mild rash that is fading with gentle skin care often needs no visit.
  when_skipped_basis: clinical
  citations:
  - doc: medlineplus_rash
    year: 2024
    section: Considerations
    url: https://medlineplus.gov/ency/article/003220.htm
    quote: the cause of a rash can be determined from how it looks
    claim_field: why
  - doc: medlineplus_rash
    year: 2024
    section: When to Contact a Medical Professional
    url: https://medlineplus.gov/ency/article/003220.htm
    quote: Many primary care providers are comfortable dealing with common rashes.
    claim_field: what
  - doc: medlineplus_rash
    year: 2024
    section: Home Care
    url: https://medlineplus.gov/ency/article/003220.htm
    quote: Many simple rashes will improve with gentle skin care and by avoiding irritating substances.
    claim_field: when_skipped
  cpts:
  - code: '99203'
    role: primary
    mapping: confirmed_pfs
  - code: '99213'
    role: alternative
    mapping: asserted
    note: Established patient. Some urgent cares bill one flat visit code instead; not priced here.
- id: skin_scraping
  layer: 2
  parent: visit
  after:
  - visit
  kind: lab
  appropriateness:
    rating: standard_of_care
    note: Skin scrapings are listed among the tests for a rash.
  likelihood_tier: possible
  plain:
    name: Skin scraping check
    technical_name: Skin scraping for fungus (KOH prep)
    what: The clinician gently scrapes a few skin flakes onto a slide and looks at them under a microscope.
    why: A scaly rash can be caused by a fungus, and a scraping tells it apart from other rashes.
    when_skipped: The rash clearly looks like a cause that needs no test.
  when_skipped_basis: logic
  reviewer_note: '[我判断] Possible: done for scaly rashes, often in the same visit.'
  citations:
  - doc: medlineplus_rash
    year: 2024
    section: Considerations
    url: https://medlineplus.gov/ency/article/003220.htm
    quote: Skin testing, such as a scraping, culture, or biopsy, may also be used
    claim_field: why
  cpts:
  - code: '87220'
    role: primary
    mapping: asserted
    note: Clinical lab fee schedule code (PFS status X).
- id: skin_sample
  layer: 2
  parent: visit
  after:
  - visit
  kind: procedure
  appropriateness:
    rating: standard_of_care
    note: A biopsy is listed among the tests for a rash whose cause is unclear.
  likelihood_tier: possible
  plain:
    name: Small skin sample
    technical_name: Skin biopsy (punch)
    what: After a numbing shot, a tiny round piece of skin is removed and sent to a lab. It may need a stitch.
    why: When the cause is still unclear, or the rash doesn't respond to treatment, a sample can settle it.
    when_skipped: The cause is clear from how the rash looks, or it clears with treatment.
  when_skipped_basis: logic
  reviewer_note: '[我判断] Possible, mostly at a skin doctor; a shave sample may be used instead.'
  citations:
  - doc: medlineplus_rash
    year: 2024
    section: Considerations
    url: https://medlineplus.gov/ency/article/003220.htm
    quote: Skin testing, such as a scraping, culture, or biopsy, may also be used
    claim_field: why
  - doc: medlineplus_skin_biopsy
    year: 2025
    section: Overview
    url: https://medlineplus.gov/lab-tests/skin-biopsy/
    quote: Most skin biopsies can be done in a health care provider's office
    claim_field: what
  cpts:
  - code: '11104'
    role: primary
    mapping: asserted
    note: Punch sample, one spot
  - code: '11102'
    role: alternative
    mapping: asserted
    note: Shave sample, one spot
  glossary:
  - biopsy
- id: pathology
  layer: 2
  parent: visit
  after:
  - skin_sample
  travels_with: skin_sample
  kind: lab
  appropriateness:
    rating: implied_by_parent
    note: Billed only when a skin sample is taken.
  likelihood_tier: possible
  plain:
    name: Lab check of the sample
    technical_name: Surgical pathology (tissue exam)
    what: A pathologist looks at the skin sample under a microscope.
    why: That is how the sample gives an answer. It's a separate bill.
    when_skipped: No sample is taken.
  when_skipped_basis: logic
  reviewer_note: Travels with skin_sample.
  citations:
  - doc: medlineplus_biopsy
    year: 2025
    section: Overview
    url: https://medlineplus.gov/biopsy.html
    quote: A doctor called a pathologist looks at the cells or tissue under a microscope
    claim_field: why
  cpts:
