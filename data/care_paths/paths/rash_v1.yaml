clinical_uncertainties:
- Test tiers (scraping, sample, skin doctor all possible) are judgment from a MedlinePlus list, not a rated guideline.
- Allergy patch testing and blood tests are not modeled.
- A blistering poison-ivy rash screens positive for the blistering red flag; a clinician should confirm that scope.
