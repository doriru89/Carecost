    quote: For more complicated skin disorders, you may need a referral to a dermatologist.
    claim_field: why
  cpts:
  - code: '99203'
    role: primary
    mapping: confirmed_pfs
  - code: '99204'
    role: alternative
    mapping: asserted
    note: Longer new-patient visit
exits:
- when: It is one spot or mole that is new or changing
  text: Answer again and choose a spot or mole on the skin. That path covers a mole check and a sample.
- when: The skin doctor finds a condition that needs ongoing treatment
  text: This tool stops here. Long-term treatment is priced differently.
