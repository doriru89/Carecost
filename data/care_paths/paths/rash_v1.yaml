# AI-drafted care path. NOT publishable until two non-AI reviewers sign off (review.status).
# Plain text is our own words; quotes are <=15 words and verified against data/care_paths/sources.yaml.
# CPT codes appear only under `cpts` (price layer). Edit freely, then run backend tests.
# R19 / P12 (2026-10-25): "rash" / 起疹子 as a person says it. First visit at urgent care, a primary-care office or
# a skin doctor; possible scraping, sample and specialist visit. Routes out to the mole path (exit).
id: rash_v1
version: 1.0.0
title:
  en: A rash without warning signs
  zh: 没有报警症状的皮疹（起疹子）
intro: Many rashes clear up with gentle skin care and by avoiding whatever irritates the skin. If yours doesn't, a
  first visit at urgent care, a primary care office or a skin doctor usually works out the cause from how it looks.
  A skin scraping or a small skin sample is taken only sometimes.
scope:
  area: skin_rash
  acuity: acute
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - rash
red_flags:
