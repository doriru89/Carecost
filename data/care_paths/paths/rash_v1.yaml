  glossary:
  - pathology
- id: skin_doctor_visit
  layer: 2
  parent: visit
  after:
  - visit
  kind: visit
  appropriateness:
    rating: standard_of_care
    note: A dermatologist visit when the rash is harder to sort out.
  likelihood_tier: possible
  plain:
    name: Visit with a skin doctor
    technical_name: Dermatologist visit (new patient)
    what: A skin specialist looks at a rash that is hard to pin down or hasn't improved.
    why: For more complicated skin problems, the first doctor may send you to a skin specialist.
    when_skipped: Your first visit was already with a skin doctor, or the rash cleared up.
  when_skipped_basis: logic
  reviewer_note: Some plans need the first doctor's order before this visit; the first visit fills that role here.
  citations:
