# AI-drafted care path. NOT publishable until two non-AI reviewers sign off (review.status).
# Plain text is our own words; quotes are <=15 words and verified against data/care_paths/sources.yaml.
# CPT codes appear only under `cpts` (price layer). Edit freely, then run backend tests.
id: colon_diagnostic_v1
version: 1.0.0
title:
  en: Colonoscopy because of symptoms (diagnostic)
  zh: 因症状做的诊断性肠镜
intro: Because you have symptoms such as bleeding, a change in bowel habits or anemia, this would be a diagnostic
  colonoscopy. It's the same procedure as a screening one, but insurance treats it like any other test.
scope:
  area: gi_lower
  acuity: subacute
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - bowel
    - screening
    Q11:
    - 'yes'
red_flags:
- rf_cardiac
- rf_chest_pain_alone
- rf_allergic_airway
- rf_non_blanching_rash
- rf_gi_bleed_heavy
- rf_gi_bleed_dark_stool
- rf_gi_bleed_dizzy
- rf_abdomen_severe
glossary:
- colonoscopy
- deductible
- coinsurance
intro_citations:
- doc: medlineplus_colonoscopy
  year: 2024
  section: Why it's done
  url: https://medlineplus.gov/colonoscopy.html
  quote: to find the cause of unexplained symptoms
  claim_field: intro
- doc: uspstf_crc_2021
  year: 2021
  section: Population
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/colorectal-cancer-screening
  quote: This recommendation applies to asymptomatic adults 45 years or older who are at average risk
  claim_field: intro
steps:
- id: referral
  layer: 0
  kind: referral
  condition:
    Q14:
    - hmo_referral_required
    - masshealth
    - unsure
  appropriateness:
    rating: plan_rule
    source: hc_gov_glossary
  likelihood_tier: certain
  plain:
    name: Visit with your main doctor first
    technical_name: Primary-care referral visit
    what: A short visit with your primary care doctor, who writes the order that lets you see a stomach and colon
      specialist.
    why: Some plans, especially HMO plans, won't pay for a specialist unless your main doctor sends a referral first.
    when_skipped: Your plan doesn't require a referral. Check your plan card or member website.
  when_skipped_basis: plan_rule
  citations:
  - doc: hc_gov_glossary
    year: 2026
    section: 'Glossary: Referral'
    url: https://www.healthcare.gov/glossary/
    quote: If you don't get a referral first, the plan may not pay for the services.
    claim_field: why
  - doc: hc_gov_glossary
    year: 2026
    section: 'Glossary: Referral'
    url: https://www.healthcare.gov/glossary/
    quote: A written order from your primary care doctor for you to see a specialist
    claim_field: what
  cpts:
  - code: '99213'
    role: primary
    mapping: asserted
    note: Established-patient visit; research marked this code [断言]. Level could be 99212-99214.
  glossary:
  - referral
  - hmo
- id: office_visit
  layer: 1
  parent: referral
  kind: visit
  appropriateness:
    rating: standard_of_care
    note: Symptoms need history and exam before choosing the test.
  likelihood_tier: likely
  plain:
    name: Visit with a doctor about the symptoms
    technical_name: New-patient office visit (primary care or gastroenterology)
    what: The doctor asks about your symptoms and history and may examine you.
    why: Symptoms need an exam first; the doctor decides whether a camera check of the colon is the right test.
    when_skipped: Your doctor sends you straight to the procedure.
  when_skipped_basis: logic
  reviewer_note: Direct-to-procedure is common when a primary care doctor already examined you.
  citations:
  - doc: medlineplus_colonoscopy
    year: 2024
    section: Why it's done
    url: https://medlineplus.gov/colonoscopy.html
    quote: to find the cause of unexplained symptoms
    claim_field: why
  cpts:
  - code: '99203'
    role: primary
    mapping: confirmed_pfs
  - code: '99204'
    role: alternative
    mapping: confirmed_pfs
- id: bowel_prep
  layer: 2
  parent: office_visit
  kind: medication
  appropriateness:
    rating: standard_of_care
    note: Required for the procedure.
  likelihood_tier: likely
  plain:
    name: Cleanout drink the day before
    technical_name: Bowel preparation
    what: A prescription laxative you drink the day before, with clear liquids only.
    why: The colon has to be empty for the doctor to see the lining.
    when_skipped: It isn't skipped.
  when_skipped_basis: logic
  reviewer_note: Always needed when the colonoscopy happens.
  citations:
  - doc: medlineplus_crc_screening_tests
    year: 2024
    section: Visual exams
    url: https://medlineplus.gov/lab-tests/colorectal-cancer-screening-tests/
    quote: usually require some type of bowel prep to clear the stool out of your colon
    claim_field: why
  no_price: true
  no_price_reason: Prescription drug, priced at the pharmacy.
- id: colonoscopy
  layer: 2
  parent: office_visit
  after:
  - office_visit
  - bowel_prep
  kind: procedure
  appropriateness:
    rating: standard_of_care
    note: Symptomatic patients fall outside USPSTF screening; colonoscopy is the standard test for unexplained lower-GI
      symptoms (MedlinePlus).
  likelihood_tier: likely
  plain:
    name: Camera check of the whole colon
    technical_name: Diagnostic colonoscopy
    what: A thin, bendable tube with a camera looks at your whole colon while you're asleep or very relaxed. You'll
      need someone to take you home.
    why: It looks for the cause of the bleeding or bowel changes, and can take samples or remove growths at the
      same time.
    when_skipped: The doctor finds a simpler cause on exam or chooses a different test first.
  when_skipped_basis: logic
  reviewer_note: Alternatives (flexible sigmoidoscopy for young patients with bright-red bleeding) are clinician
    choice.
  citations:
  - doc: medlineplus_colonoscopy
    year: 2024
    section: Why it's done
    url: https://medlineplus.gov/colonoscopy.html
    quote: to find the cause of unexplained symptoms
    claim_field: why
  - doc: medlineplus_crc_screening_tests
    year: 2024
    section: Uses
    url: https://medlineplus.gov/lab-tests/colorectal-cancer-screening-tests/
    quote: may also be used as diagnostic tests.
    claim_field: why
  cpts:
  - code: '45378'
    role: primary
    mapping: confirmed_pfs
    note: Diagnostic; no preventive modifier
  glossary:
  - colonoscopy
  learn_more:
  - kind: medlineplus_connect
    label: 'MedlinePlus: Colonoscopy'
    url: https://connect.medlineplus.gov/application?mainSearchCriteria.v.cs=2.16.840.1.113883.6.12&mainSearchCriteria.v.c=45378&informationRecipient.languageCode.c=en
    code: '45378'
    resolved_title: Colonoscopy
- id: anesthesia
  layer: 2
  parent: office_visit
  travels_with: colonoscopy
  kind: anesthesia
  appropriateness:
    rating: standard_of_care
    note: Sedation is standard for colonoscopy.
  likelihood_tier: likely
  plain:
    name: Medicine so you sleep through it
    technical_name: Anesthesia for colonoscopy
    what: Medicine through an IV so you're asleep or very relaxed, often from a separate anesthesia team.
    why: It keeps you comfortable. When an anesthesia team gives it, it arrives as its own bill.
    when_skipped: Some people get lighter sedation from the colon doctor's own team, with no separate anesthesia
      bill.
  when_skipped_basis: logic
  reviewer_note: '[断言] separate-anesthesia share not sourced.'
  citations:
  - doc: medlineplus_anesthesia
    year: 2025
    section: Monitored sedation
    url: https://medlineplus.gov/anesthesia.html
    quote: It may be used for a colonoscopy or dental work.
    claim_field: why
  cpts:
  - code: 00811
    role: primary
    mapping: confirmed_pfs
    note: Anesthesia, lower intestinal endoscopy, not screening
  glossary:
  - anesthesia
  - colonoscopy
  learn_more:
  - kind: medlineplus_connect
    label: 'MedlinePlus: Anesthesia'
    url: https://connect.medlineplus.gov/application?mainSearchCriteria.v.cs=2.16.840.1.113883.6.12&mainSearchCriteria.v.c=00811&informationRecipient.languageCode.c=en
    code: 00811
    resolved_title: Anesthesia
- id: biopsy_or_removal
  layer: 2
  parent: office_visit
  after:
  - colonoscopy
  kind: procedure
  appropriateness:
    rating: standard_of_care
    note: Samples or removal are taken when something is seen; part of the same procedure.
  likelihood_tier: possible
  plain:
    name: Taking samples or removing growths
    technical_name: Colonoscopy with biopsy or polyp removal
    what: If the doctor sees an inflamed area or a growth, they take a small sample or remove it through the same
      tube.
    why: A sample tells what's causing the symptoms; removing growths prevents future problems.
    when_skipped: Everything looks normal.
  when_skipped_basis: logic
  reviewer_note: Replaces the plain colonoscopy line in billing when it happens.
  citations:
  - doc: medlineplus_crc_screening_tests
    year: 2024
    section: Purpose
    url: https://medlineplus.gov/lab-tests/colorectal-cancer-screening-tests/
    quote: Some screening tests let your health care provider find and remove abnormal growths
    claim_field: why
  cpts:
  - code: '45380'
    role: primary
    mapping: confirmed_pfs
    note: With biopsy
  - code: '45385'
    role: alternative
    mapping: confirmed_pfs
    note: Snare removal
  glossary:
  - biopsy
  - colonoscopy
  - polyp
  learn_more:
  - kind: medlineplus_connect
    label: 'MedlinePlus: Colonoscopy'
    url: https://connect.medlineplus.gov/application?mainSearchCriteria.v.cs=2.16.840.1.113883.6.12&mainSearchCriteria.v.c=45380&informationRecipient.languageCode.c=en
    code: '45380'
    resolved_title: Colonoscopy
- id: pathology
  layer: 2
  parent: office_visit
  after:
  - biopsy_or_removal
  travels_with: biopsy_or_removal
  kind: lab
  appropriateness:
    rating: implied_by_parent
    note: Every biopsy sample is read by a pathologist; 88305 is its own PFS line (status A, separate professional/technical
      rows), so it is a separate bill.
  likelihood_tier: possible
  plain:
    name: Lab check of the samples
    technical_name: Surgical pathology (tissue exam)
    what: A pathologist looks at the samples under a microscope and writes the diagnosis.
    why: It's the diagnosis, and it's billed separately from the procedure, often by a different company.
    when_skipped: No samples are taken.
  when_skipped_basis: logic
  reviewer_note: Travels with biopsy_or_removal.
  citations:
  - doc: medlineplus_biopsy
    year: 2025
    section: Overview
    url: https://medlineplus.gov/biopsy.html
    quote: A doctor called a pathologist looks at the cells or tissue under a microscope
    claim_field: why
  cpts:
  - code: '88305'
    role: primary
    mapping: confirmed_pfs
  glossary:
  - pathology
coverage_note: Because you have symptoms, your deductible and coinsurance usually apply, unlike a screening colonoscopy,
  which most plans cover in full.
coverage_citations:
- doc: uspstf_crc_2021
  year: 2021
  section: Population
  url: https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/colorectal-cancer-screening
  quote: This recommendation applies to asymptomatic adults 45 years or older who are at average risk
  claim_field: coverage
