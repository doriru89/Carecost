- name: Blood in stool and fatigue
  answers:
    Q0: []
    Q1: bowel
    Q11: 'yes'
  expect: colon_diagnostic_v1
  expect_tiers:
    colonoscopy: likely
- name: Came for screening but is anemic
  answers:
    Q0: []
    Q1: screening
    Q8: age_60_75
    Q11: 'yes'
  expect: colon_diagnostic_v1
- name: Bowel change, no warning signs
  answers:
    Q0: []
    Q1: bowel
    Q11: none
  expect: bowel_change_see_doctor
- name: 'Red flag: black stool'
  answers:
    Q0:
    - rf_gi_bleed_dark_stool
    Q1: bowel
    Q11: 'yes'
  expect: seen_today
- name: 'Red flag: sudden severe belly pain'
  answers:
    Q0:
    - rf_abdomen_severe
    Q1: bowel
  expect: er_today
clinical_uncertainties:
- Q11 lumps upper and lower alarm features; a 'black stool' answer here also triggers the seen-today red flag, which
  stops the path. Clinician to confirm the overlap is acceptable.
