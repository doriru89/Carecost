  plain:
    name: Visit with your main doctor first
    technical_name: Primary-care referral visit
    what: A short visit with your primary care doctor, who writes the order that lets you see a stomach and colon
      specialist.
    why: Some plans, especially HMO plans, won't pay for a specialist unless your main doctor sends a referral first.
    when_skipped: Your plan doesn't require a referral. Check your plan card or member website.
  when_skipped_basis: plan_rule
