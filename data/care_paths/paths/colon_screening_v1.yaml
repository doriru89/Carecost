- id: polyp_removal
  layer: 2
  parent: pre_procedure_consult
  after:
  - colonoscopy
  kind: procedure
  appropriateness:
    rating: standard_of_care
    note: Removal during screening is the purpose of the test; federal FAQ counts it as integral.
  likelihood_tier: possible
  plain:
    name: Removing growths found during the check
    technical_name: Polyp removal (polypectomy)
    what: If the doctor sees a small growth on the colon wall, they remove it through the same tube.
    why: Removing growths is the point of screening, and federal rules count it as part of the free screening.
    when_skipped: No growths are found.
  when_skipped_basis: logic
  reviewer_note: Coding changes the line, not the clinical step.
