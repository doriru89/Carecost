- id: polyp_pathology
  layer: 2
  parent: pre_procedure_consult
  after:
  - polyp_removal
  travels_with: polyp_removal
  kind: lab
  appropriateness:
    rating: implied_by_parent
    note: Every biopsy sample is read by a pathologist; 88305 is its own PFS line (status A, separate professional/technical
      rows), so it is a separate bill.
  likelihood_tier: possible
  plain:
    name: Lab check of the removed growth
    technical_name: Surgical pathology (tissue exam)
    what: A pathologist looks at the removed tissue under a microscope.
    why: It tells whether the growth was the kind that can turn into cancer, which sets the date of your next check.
    when_skipped: No growths are removed.
  when_skipped_basis: logic
  reviewer_note: Travels with polyp_removal.
  citations:
