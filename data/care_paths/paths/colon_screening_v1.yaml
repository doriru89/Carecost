    note: Required for the procedure to be done; not separately rated.
  likelihood_tier: likely
  plain:
    name: Cleanout drink the day before
    technical_name: Bowel preparation
    what: A prescription laxative you drink the day before, with clear liquids only.
    why: The colon has to be empty for the doctor to see the lining.
    when_skipped: It isn't skipped.
  when_skipped_basis: logic
