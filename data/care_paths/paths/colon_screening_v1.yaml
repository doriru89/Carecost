  cpts:
  - code: '88305'
    role: primary
    mapping: confirmed_pfs
  glossary:
  - pathology
coverage_note: On most plans, the cleanout, the procedure, the sedation, growth removal and the lab check are all
  part of free preventive screening, including a colonoscopy after a positive home stool test. Some older 'grandfathered'
  plans may not follow this rule. On Medicare, if a growth is removed you pay 15% coinsurance for the doctor's part.
