  all_of:
    Q1:
    - screening
    Q8:
    - age_45_59
    - age_60_75
    Q11:
    - none
    Q13:
    - none
    - positive_stool_test
red_flags:
- rf_cardiac
- rf_chest_pain_alone
- rf_allergic_airway
- rf_non_blanching_rash
- rf_gi_bleed_heavy
- rf_gi_bleed_dark_stool
- rf_gi_bleed_dizzy
- rf_abdomen_severe
glossary:
- colonoscopy
- anesthesia
- coinsurance
