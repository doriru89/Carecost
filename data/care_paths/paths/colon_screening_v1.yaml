- id: colonoscopy
  layer: 2
  parent: pre_procedure_consult
  after:
  - bowel_prep
  kind: procedure
  appropriateness:
    rating: uspstf_A
    source: uspstf_crc_2021
    note: Grade A at 50-75; grade B at 45-49 (same cap).
  likelihood_tier: certain
  plain:
    name: Camera check of the whole colon
    technical_name: Screening colonoscopy
    what: A thin, bendable tube with a camera looks at your whole colon while you're asleep or very relaxed. You'll
      need someone to take you home.
    why: It finds growths and removes them during the same procedure, before they can turn into cancer.
    when_skipped: You choose a different screening test, such as a yearly at-home stool test.
  citations:
