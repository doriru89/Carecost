id: colon_screening_v1
version: 1.0.0
title:
  en: Colon cancer screening with a colonoscopy (no symptoms)
  zh: 无症状的肠镜结肠癌筛查
intro: If you're 45 or older with no symptoms, a colonoscopy is one of several ways to check for colon cancer. Others
  include a yearly at-home stool test. A camera check every 10 years is the most thorough, and it's the only one
  that removes growths on the spot.
