    rating: standard_of_care
    note: Practice policy, not a clinical rating; if required, it is part of the preventive service.
  likelihood_tier: possible
  plain:
    name: Short visit with the colon doctor first
    technical_name: GI pre-procedure consultation
    what: A brief visit before the procedure day to review your health and medicines and explain the cleanout.
    why: Some practices require it. If yours does, federal guidance says it counts as part of the free screening.
    when_skipped: Many centers book the procedure directly, with a phone call instead of a visit.
  when_skipped_basis: logic
  reviewer_note: Share of Boston practices using direct-access booking is unknown.
