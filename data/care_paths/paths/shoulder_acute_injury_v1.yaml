clinical_uncertainties:
- Whether an acute shoulder injury belongs at urgent care or an orthopedic walk-in (vs the ER) needs a clinician's
  view; we route only deformity/numbness to the ER.
- 'Fracture follow-up (ACR V2-V3: CT or MRI) is intentionally out of scope.'
