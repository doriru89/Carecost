    note: Rehab after a soft-tissue shoulder injury is routine care; no imaging-style rating applies.
  likelihood_tier: possible
  plain:
    name: Guided exercise program for the shoulder
    technical_name: Physical therapy evaluation and visits
    what: A therapist checks your motion and strength, then teaches exercises to get the shoulder moving and strong
      again.
    why: After the first rest period, exercise is the usual next treatment for strains and sprains.
    when_skipped: The shoulder recovers on its own with home care.
  when_skipped_basis: logic
