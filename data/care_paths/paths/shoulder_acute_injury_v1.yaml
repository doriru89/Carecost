id: shoulder_acute_injury_v1
version: 1.0.0
title:
  en: Shoulder pain after a fall or injury
  zh: 摔倒或受伤后的肩痛
intro: After a shoulder injury, the first question is whether anything is broken or out of place. That starts with
  an exam and a quick bone picture. If the bones look fine but the arm is weak or unstable, a scan of the tendons
  may follow.
scope:
  area: msk_shoulder
  acuity: acute
  severity_band:
  - minor
  - moderate
entry:
  all_of:
    Q1:
    - shoulder
    Q2:
    - injury
red_flags:
- rf_cardiac
- rf_chest_pain_alone
- rf_allergic_airway
- rf_non_blanching_rash
- rf_septic_joint
- rf_limb_deformity
- rf_systemic_msk
- rf_shoulder_urgent
