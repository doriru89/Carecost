    procedure: US shoulder
  likelihood_tier: possible
  plain:
    name: Live sound-wave picture of the tendons
    technical_name: Shoulder ultrasound
    what: A probe on your skin uses sound waves to show the tendons in real time. No radiation.
    why: If the exam suggests a torn tendon and the X-ray shows no break, this checks the tendon directly.
    when_skipped: Your arm is strong on the exam, so a tear is unlikely.
