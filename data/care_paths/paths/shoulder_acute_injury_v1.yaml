- id: shoulder_mri
  layer: 2
  parent: visit
  after:
  - visit
  - xray
  kind: imaging
  appropriateness:
    rating: UA
    source: acr_acute_shoulder_2024
    variant: 6
    procedure: MRI shoulder without IV contrast
  likelihood_tier: possible
  plain:
    name: Detailed scan of tendons & cartilage
    technical_name: Shoulder MRI (no contrast)
    what: A strong magnet makes detailed pictures of the tendons, cartilage and joint lining. You lie still inside
      a tube-shaped machine.
    why: If the arm is weak or the joint feels unstable after the injury, this shows tendon tears and damage from
      a dislocation.
    when_skipped: The exam is reassuring and the arm recovers over the first weeks.
  citations:
  - doc: acr_acute_shoulder_2024
    year: 2024
