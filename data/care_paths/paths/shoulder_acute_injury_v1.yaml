  section: 'Variant 1 (Radiography: Usually Appropriate)'
  url: https://acsearch.acr.org/docs/69433/Narrative/
  quote: Adult. Acute shoulder pain. Any etiology. Initial imaging.
  claim_field: intro
steps:
- id: referral
  layer: 0
  kind: referral
  condition:
    Q14:
    - hmo_referral_required
    - masshealth
    - unsure
  appropriateness:
    rating: plan_rule
    source: hc_gov_glossary
  likelihood_tier: certain
  plain:
    name: Visit with your main doctor first
    technical_name: Primary-care referral visit
    what: A short visit with your primary care doctor, who writes the order that lets you see a bone and joint specialist.
    why: Some plans, especially HMO plans, won't pay for a specialist unless your main doctor sends a referral first.
    when_skipped: Your plan doesn't require a referral. Check your plan card or member website.
  when_skipped_basis: plan_rule
  citations:
  - doc: hc_gov_glossary
    year: 2026
    section: 'Glossary: Referral'
    url: https://www.healthcare.gov/glossary/
    quote: If you don't get a referral first, the plan may not pay for the services.
    claim_field: why
  - doc: hc_gov_glossary
    year: 2026
    section: 'Glossary: Referral'
    url: https://www.healthcare.gov/glossary/
    quote: A written order from your primary care doctor for you to see a specialist
    claim_field: what
  cpts:
  - code: '99213'
    role: primary
    mapping: asserted
    note: Established-patient visit; research marked this code [断言]. Level could be 99212-99214.
  glossary:
  - referral
  - hmo
- id: visit
  layer: 1
  parent: referral
  kind: visit
  appropriateness:
    rating: standard_of_care
    note: ACR acute variants 4-6 are defined by what the exam finds; the visit itself is not rated.
  likelihood_tier: certain
  plain:
    name: Same-day check at urgent care or a bone & joint clinic
    technical_name: Urgent-care or orthopedic new-patient visit
    what: A clinician checks where it hurts, how far the arm moves and how strong it is, and looks for signs of
      a break or dislocation.
    why: The exam decides whether you need a bone picture right away and whether a tendon or the joint's stability
      might be the problem.
    when_skipped: It isn't skipped on this path.
  when_skipped_basis: logic
  reviewer_note: Urgent care vs. orthopedic walk-in vs. ER depends on severity; red flags already route deformity
    to the ER.
  citations:
  - doc: acr_acute_shoulder_2024
    year: 2024
    section: Variant 4
    url: https://acsearch.acr.org/docs/69433/Narrative/
    quote: History or physical examination consistent with dislocation or instability.
    claim_field: why
  - doc: acr_acute_shoulder_2024
    year: 2024
    section: Variant 6
    url: https://acsearch.acr.org/docs/69433/Narrative/
    quote: Physical examination consistent with rotator cuff tear. Radiographs negative or indeterminate.
    claim_field: what
  cpts:
  - code: '99203'
    role: primary
    mapping: confirmed_pfs
  - code: '99204'
    role: alternative
    mapping: confirmed_pfs
    note: Higher-complexity new-patient visit
- id: xray
  layer: 2
  parent: visit
  after:
  - visit
  kind: imaging
  appropriateness:
    rating: UA
    source: acr_acute_shoulder_2024
    variant: 1
    procedure: Radiography shoulder
  likelihood_tier: likely
  plain:
    name: Quick picture of the shoulder bones
    technical_name: Shoulder X-ray
    what: A few pictures of the shoulder made with a small dose of radiation. It's quick and needs no preparation.
    why: After a shoulder injury, an X-ray is the only test guidelines rate as the right first picture. It shows
      breaks and dislocations.
    when_skipped: The clinician is confident from the exam that nothing is broken or out of place.
  when_skipped_basis: logic
  reviewer_note: No decision rule like Ottawa exists for the shoulder; skipping is clinician judgment.
  citations:
  - doc: acr_acute_shoulder_2024
