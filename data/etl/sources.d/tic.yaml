# Insurer Transparency-in-Coverage sources (stream A2), read by backend/app/etl/tic/.
# Network choice, product, line of business and why each file was picked are in
# data/etl/tic_networks.yaml (keyed by source_id). URLs are this month's verified files; the
# monthly job re-resolves them from `discovery` (`python -m app.etl tic discover`).
#
# allowed_domains: payer-owned registrable domains match their subdomains; shared cloud hosts
# (Azure blob / Front Door) are exact hostnames plus a path prefix (fetch.AllowEntry).
#
# Harvard Pilgrim and Tufts Direct publish .zip in-network files. config.py allows only gzip /
# plain for tic_in_network, so those cannot be registered here yet; they are listed in
# tic_networks.yaml with `unregistered: zip_container` (see the A2 report).
