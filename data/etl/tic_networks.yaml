# TiC networks read by the A2 pipeline (python -m app.etl tic ...). One entry per in-network
# file = one payer x network job; each is built and released on its own (a failing one falls
# back to its last good release and never blocks the others).
#
#   source_id   sources.d/tic.yaml id (registered) - or, for zip files that config.py cannot
#               register yet, `unregistered: zip_container` plus url / discovery / container here.
#   label       network name shown in plan_raw (rate_row) and in the coverage report.
#   product     HMO / PPO / POS / EPO / INDEMNITY ('' when the file does not say).
#   lob         rate_row.line_of_business.
#   discover    how the monthly job finds next month's file: `toc` = a tic_table_of_contents
#               source id, `match` = regex on the file name in that TOC / listing. The newest
#               match whose host is already allowlisted wins; other hosts are reported only.
#               `rewrite: [from, to]` is applied to every TOC URL first (BCBS lists three self-
#               insured files only under a `_Third-Party` name that is a 3 KB placeholder; the
#               real file is the same name without it, verified by download 2026-10-24).
#   why         why this file was picked (TOC evidence, 2026-10).
#
# Picked from the October 2026 TOCs (fetched 2026-10-24). Files listed in those TOCs that are
# NOT here, and why: BCBS `*_Third-Party_*` (3,475-byte placeholder gzips) and the BlueCard
# host-plan files on bcbsma.mrf.bcbs.com (other Blues' networks, incl. 700_23C0 "MA-HMO Blue"
# host file); dental / vision / chiro / behavioral vendor files; MGB CAP_* capitation files and
# MultiPlan PHCS; HP NH/ME networks (A025 A035 A043 A061 A075 A081 A087 A088) and the Best Buy
# employer networks (A010 A020); Aetna Exchange (individual market, not sold in MA) and the
# thousands of per-employer `pl-xxx-<hash>` copies; UHC/UMR wrap files used by HP and MGB for
# out-of-area members (15 GB each, same national network as Options PPO / Choice Plus).

version: 1

