# Source registry: one row per source file. SSOT for what the ETL fetches and how it reads it.
#
#   python -m app.etl fetch|stage|normalize|build|report  (backend/app/etl/cli.py)
#
# npis = type_2_npi values exactly as read from the file (tests/etl/test_sources.py checks
# them against the file metadata fixtures; data/registries/hospitals.yaml must agree).
# url = the file itself. discovery = the cms-hpt.txt that points at it (re-read 2026-10-24).
# url: null means we cannot fetch it automatically yet (fetch reports it).
# legacy_filename = the name under the old carecost/data/raw/hospital_mrfs/ (fetch --import-dir).
#
# More sources live in data/etl/sources.d/*.yaml (one file per stream, e.g. tic.yaml, government.yaml).
# Fragment format: {version, allowed_domains: [...], sources: [...]}; a duplicate source_id fails.

version: 1

fetch:
  # Downloads must stay on these registrable domains (redirects included).
  allowed_domains:
    - massgeneralbrigham.org
    - bidmc.org
    - mountauburnhospital.org
    - nebh.org
    - bidneedham.org
    - bidmilton.org
    - bmchealthsystem.org
    - tuftsmedicine.org
    - challiance.org
    - childrenshospital.org
    - dana-farber.org
    - franciscanchildrens.org
    # Dana-Farber's cms-hpt.txt points at its Widen DAM, which 303s to Widen's CDN. Exact hosts,
    # not the registrable domain: widen.net / widencdn.net serve every Widen customer.
    - dfci.widen.net
    - cf-store.widencdn.net
  default_max_bytes: 1500000000  # 1.5 GB compressed; Tufts zip is ~177 MB, CHA csv ~327 MB
  timeout_s: 600

sources:
  - source_id: mgh_mrf
    kind: hospital_mrf
    entity_id: mgh
    format: cms_v3_csv_tall
    container: zip
    encoding: latin-1
    npis: ["1023049236"]
    url: https://www.massgeneralbrigham.org/price-transparency/042697983_Massachusetts-General-Hospital_StandardCharges.zip
    discovery: https://www.massgeneralbrigham.org/cms-hpt.txt
    legacy_filename: mgh_standardcharges.zip

  - source_id: brigham_mrf
    kind: hospital_mrf
    entity_id: brigham
    format: cms_v3_csv_tall
    container: zip
    encoding: latin-1
    npis: ["1790717650"]
    url: https://www.massgeneralbrigham.org/price-transparency/042312909_Brigham-and-Womens-Hospital_StandardCharges.zip
    discovery: https://www.massgeneralbrigham.org/cms-hpt.txt
    legacy_filename: brigham_standardcharges.zip

  - source_id: faulkner_mrf
    kind: hospital_mrf
    entity_id: faulkner
    format: cms_v3_csv_tall
    container: zip
    encoding: latin-1
    npis: ["1578677811"]
    url: https://www.massgeneralbrigham.org/price-transparency/042768256_Brigham-and-Womens-Faulkner-Hospital_StandardCharges.zip
    discovery: https://www.massgeneralbrigham.org/cms-hpt.txt
    legacy_filename: faulkner_standardcharges.zip

  - source_id: bmc_mrf
    kind: hospital_mrf
    entity_id: bmc
    format: cms_v3_csv_tall
    container: zip
    encoding: utf-8
    npis: ["1346218294"]
    url: https://www.bmchealthsystem.org/wp-content/uploads/043314093_BostonMedicalCenter_standardcharges.csv.zip
    discovery: https://www.bmchealthsystem.org/cms-hpt.txt
    legacy_filename: bmc_standardcharges.zip

  - source_id: bmc_brighton_mrf
    kind: hospital_mrf
    entity_id: bmc_brighton
    format: cms_v3_csv_tall
    container: zip
    encoding: utf-8
    npis: ["1720814072"]
    url: https://www.bmchealthsystem.org/wp-content/uploads/272473667_BostonMedicalCenterBrighton_standardcharges.csv.zip
    discovery: https://www.bmchealthsystem.org/cms-hpt.txt
    legacy_filename: bmc_brighton_standardcharges.zip

  - source_id: cha_mrf
    kind: hospital_mrf
    entity_id: cha
    format: cms_v3_csv_tall
    container: plain
    encoding: utf-8
    # One file for three campuses (Cambridge, Somerville, Whidden); NPIs repeat per campus.
    npis: ["1487603585", "1447348313"]
    url: https://www.challiance.org/File%20Library/Uploads/PriceTransparency20262320.csv
    discovery: https://www.challiance.org/cms-hpt.txt
    legacy_filename: cha_standardcharges.csv

  - source_id: tufts_mrf
    kind: hospital_mrf
    entity_id: tufts
    format: cms_v3_csv_tall
    container: zip
    encoding: latin-1
    npis: ["1730132515"]
    # Confirmed in tuftsmedicine.org/cms-hpt.txt 2026-10-24. Akamai 403s curl (any UA) but serves
    # the ETL's own httpx client; robots.txt allows /sites/default/files/.
    url: https://www.tuftsmedicine.org/sites/default/files/2026-03/043400617_tuftsmedicalcenter_standardcharges.csv.zip
    discovery: https://www.tuftsmedicine.org/cms-hpt.txt
    legacy_filename: tufts_standardcharges.zip

  - source_id: franciscan_mrf
    kind: hospital_mrf
    entity_id: franciscan
    format: cms_v3_csv_wide
    container: plain
    encoding: latin-1
    npis: ["1710910427"]
    # franciscanchildrens.org/cms-hpt.txt now redirects to franciscans.childrenshospital.org (2026-10-24).
    # That host sends no intermediate certificate (Sectigo OV R36), so fetch fails TLS
    # verification; we do not disable verification. Same bytes as the 2026-05 copy (sha f7d22355).
    url: https://franciscans.childrenshospital.org/sites/default/files/shoppable/042156082_Franciscan_Hospital_for_Children_Standardsharges.csv
    discovery: https://franciscans.childrenshospital.org/cms-hpt.txt
    legacy_filename: franciscan_standardcharges.csv

  - source_id: bidmc_mrf
    kind: hospital_mrf
    entity_id: bidmc
    format: cms_v3_json
    container: plain
    encoding: utf-8-sig
    npis: ["1548202641"]
    url: https://bidmc.org/042103881_beth-israel-deaconess-medical-center_standardcharges.json
