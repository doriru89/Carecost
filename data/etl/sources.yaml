    legacy_filename: childrens_standardcharges.json

  - source_id: dana_farber_mrf
    kind: hospital_mrf
    entity_id: dana_farber
    format: cms_v3_json
    container: plain
    encoding: utf-8-sig
    npis: ["1851333686"]
    # From dana-farber.org/cms-hpt.txt (2026-10-24); the Widen link 303s to a signed CDN URL.
    url: https://dfci.widen.net/content/759njv3uoe/original/04-2263040_dana-farber-cancer-institute_standardcharges.json?u=rnuji5&download=true
    discovery: https://www.dana-farber.org/cms-hpt.txt
