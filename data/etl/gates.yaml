# Quality gates run by `python -m app.etl build`. Any failure -> non-zero exit, the build is
# written to data/build/<id>/ with gates.json, and the LATEST pointer is NOT moved.

version: 1

# Known real rates. A missing anchor fails the build. When the source file is the one the
# anchor was read from (exact_sha256) the amount must match to the cent; on a newer file the
# amount may drift by tolerance_pct (chargemasters move), beyond that the gate fails.
anchors:
  - id: brigham_11102_aetna_hmo_facility
    entity_id: brigham
    code: "11102"
    payer_raw: "AETNA [1001]"
    plan_raw: "HB AMC AETNA HMO"
    rev_code: "0761"
    amount: 417.40
    exact_sha256: 188337340e253f44f42ded9c15b7e1a957e167e35c2a6a88c21bc63ac1c769ce
    tolerance_pct: 25
  - id: brigham_11102_aetna_hmo_professional
    entity_id: brigham
    code: "11102"
    payer_raw: "AETNA [1001]"
    plan_raw: "HB AMC AETNA HMO"
    rev_code: "0983"
    amount: 115.17
    exact_sha256: 188337340e253f44f42ded9c15b7e1a957e167e35c2a6a88c21bc63ac1c769ce
    tolerance_pct: 25
  - id: bidmc_73030_bcbs_hmo
    entity_id: bidmc
    code: "73030"
    payer_raw: "Bcbs"
    plan_raw: "Hmo"
    rev_code: ""
    amount: 110.42
    exact_sha256: 738d667752fb807cc8ea5019baf2c26319e68199e9dad8c7e8127a480804f278
    tolerance_pct: 25

# Per-source rate_row count may not fall by more than this vs the previous good build.
row_count:
  max_drop_pct: 20
  min_payer_rate_rows_per_source: 1   # E1 regression guard: every hospital must yield payer rates

# File age = build date - the file's own last_updated_on. CMS requires an annual update
# (45 CFR 180.50(e)), so > fail_after_days fails; > warn_after_days is flagged "may be stale".
staleness:
  warn_after_days: 180
  fail_after_days: 365
