    provider: phone
    label: Call
    phone: 617-923-2273
  service_areas:
  - urgent_care
  - ortho
  tins:
  - '460903626'
  tins_source: 'research-v3/clinic-census.csv GB0378: org NPI 1164772299 -> ''DRX UC WATERTOWN PC DBA AFC URGENT
    CARE'' in the BCBS TiC file (2026-10-24)'
  listing_status: web_verified
  listing_checked_at: '2026-10-24'
  cash_prices:
  - item_id: evaluation_consultation
    label: Evaluation Consultation (provider)
    # A7 2026-10-25: the page's one provider-visit price ("Evaluation Consultation (provider)
    # $179", and "STD Testing $179 plus the cost of the test"), with no visit levels. Read as the
    # self-pay price of any new or established office visit level 2-5 (99211, a nurse visit, is
    # left out). Source: the page below, snapshot data/sites/posted/afc_watertown.json.
    codes:
    - '99202'
    - '99203'
    - '99204'
    - '99205'
    - '99212'
    - '99213'
    - '99214'
    - '99215'
    amount: 179.0
    includes_provider_fee: true
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  # A7 2026-10-25: the X-ray and lab rows below are from the same page (snapshot
  # data/sites/posted/afc_watertown.json, page_sha256 c5d48751...). The page prices X-rays by the
  # number of views, not by body part: "X-Ray 1 View / 2 views / 3 views" = "$80 / $150 / $225",
  # which the reader splits into one item each. A code is mapped only when its CPT descriptor
  # names one view count the page prices: 73030 shoulder (min 2) and 73600 ankle (2) -> 2 views;
  # 73562 knee (3) and 73610 ankle (complete, min 3) -> 3 views. Left out because the descriptor
  # spans two of the page's prices: 73560 knee "1 or 2 views" ($80 or $150), 72100 lumbar spine
  # "2 or 3 views" ($150 or $225); 73564 knee 4+ views has no price. 73030 also covers 3+ views,
  # so $150 is its price when 2 views are taken.
  - item_id: xray_1_view
    label: X-Ray 1 View
    codes: []
    amount: 80.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  - item_id: xray_2_views
    label: X-ray, 2 views
    codes:
    - '73030'
    - '73600'
    amount: 150.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  - item_id: xray_3_views
    label: X-Ray 3 views
    codes:
    - '73562'
    - '73610'
    amount: 225.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  # Urinalysis: two $30 rows, both unmapped. "Rapid Urine analysis (UA)" is an in-clinic
  # dipstick; it is 81003 (automated, without microscopy) only if read by an analyzer, 81002 if
  # read by eye, and the page does not say which. The send-out "Urine analysis (UA)" can be 81001
  # (with microscopy), 81003 or 81002 at the lab. Either way the page's price is $30.
  - item_id: urinalysis_rapid
    label: Rapid Urine analysis (UA)
    codes: []
    amount: 30.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  - item_id: urinalysis_send_out
    label: Urine analysis (UA)
    codes: []
    amount: 30.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  # 81025 is "urine pregnancy test, by visual color comparison": the rapid in-clinic hCG test.
  - item_id: pregnancy_test_rapid
    label: Rapid Pregnancy test
    codes:
    - '81025'
    amount: 30.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  # CBC and CMP are under "Most Common Send Out Labs" (AFC sends the sample out), but the page
  # posts them as AFC's own self-pay price: what the patient pays AFC. The row reads "$60 / $60"
  # (two equal prices, no column header), so $60. Venipuncture is posted apart ($15, 36415, no
  # path uses it).
  - item_id: cbc_diff_plt
    label: CBC DIFF PLT
    codes:
    - '85025'
    amount: 60.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  - item_id: cmp
    label: CMP
    codes:
    - '80053'
    amount: 60.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  - item_id: sling
    label: Sling
    codes: []
    amount: 32.0
    includes_provider_fee: null
    source_url: https://www.afcurgentcare.com/watertown/resources/self-pay
    checked_at: '2026-10-24'
  billing_type_confidence: stated
