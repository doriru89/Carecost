    lon: -71.159
    geocoded_by: manual
    geocoded_at: '2026-10-24'
  phone: 617-923-2273
  hours:
    source: operator_schema_org
    source_url: https://www.afcurgentcare.com/watertown/
    checked_at: '2026-10-24'
    weekly:
    - days:
