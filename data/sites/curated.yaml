# Hand-checked site fields. `python -m app.sites.build` merges each entry over the entry it
# derives from the census (match_census_id) or from hospitals.yaml (match_hospital_entity_id);
# every field given here wins. Seeded 2026-10-24 from contracts/fixtures/sites.json (the P1
# slice's checked entries: hours, booking links, AFC's posted self-pay prices).
version: 1
sites:
- match_census_id: GB0378
  id: afc_watertown
  name: AFC Urgent Care Watertown
  site_type: urgent_care
