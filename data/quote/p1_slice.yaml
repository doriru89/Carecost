# P1 thin real slice: what the minimal quote engine (backend/app/quote/engine.py) prices.
# Scope: one care path x {BCBS HMO, cash} x 3 sites. Stream C replaces this file with the real
# site registry (data/sites/sites.yaml, A3) and a payer/network registry.
version: 1
care_path: shoulder_chronic_clicking_v1

# sites.yaml ids (P1 reads contracts/fixtures/sites.json until A3 writes data/sites/sites.yaml).
# Picked by real row counts, see docs/p1-slice.md.
sites:
  - tufts_medical_center    # large academic hospital, tufts_mrf + TiC TIN 043400617
  - mount_auburn_hospital   # community hospital, mtauburn_mrf + TiC TINs of its doctor groups
  - afc_watertown           # non-hospital urgent care, TiC TIN 460903626 only

# QuoteRequest.payment {payer_id, product} -> TiC in-network files to read. The request's
# `network` is None (the person does not know whether their employer plan is fully or
# self insured), so both HMO Blue files are read and their rates form one range.
networks:
  BCBS_MA/HMO: [tic_bcbs_ma_hmo_blue_fi, tic_bcbs_ma_hmo_blue_si]

# A TiC professional row prices a site only when its service_code (CMS place of service)
# matches how the site bills: 22 = on-campus hospital outpatient, 11 = office.
place_of_service:
  hospital_outpatient: ["22"]
  office_visit: ["11"]

# At a hospital the doctor's part of an imaging test is the reading, billed with modifier 26.
professional_modifier:
  "73030": "26"
  "73221": "26"
  "73222": "26"
  "76881": "26"
  "76882": "26"

# Therapy codes are billed by the hospital on its own claim; there is no separate doctor's fee.
facility_only_codes: ["97161", "97162", "97163", "97110"]

# Add-on codes that repeat per visit, priced per unit and never summed.
per_15_minutes: ["97110"]

you_pay:
  BCBS_MA:
    kind: copay_or_deductible
    portal_label: Check my deductible at MyBlue
    portal_url: https://www.bluecrossma.org/myblue
