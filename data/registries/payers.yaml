# Payer identity registry.
# id (key) = stable key used in payer_rates table `payer_id` column (uppercase, regional).
# slug = frontend-friendly key used in UI routing (lowercase).
# normalization_patterns = raw payer name patterns from MRF/TiC files that map to this payer.
# tic_portal = CMS Transparency in Coverage data URL.

payers:
  BCBS_MA:
    slug: "bcbs"
    label: "Blue Cross Blue Shield (BCBS)"
    carrier_patterns: ["blue cross", "bcbs"]
    is_default: true
    normalization_patterns: ["BLUE CROSS", "BCBS"]
    tic_portal: "https://transparency-in-coverage.bluecrossma.com/"
    legal_basis: "45 CFR 147.212"

  AETNA:
    slug: "aetna"
    label: "Aetna"
    carrier_patterns: ["aetna"]
    is_default: false
    normalization_patterns: ["AETNA"]
    tic_portal: "https://health1.aetna.com/app/public/#/one/insurerCode=AETNA_I&brandCode=ALICSI"
    legal_basis: "45 CFR 147.212"

  HARVARD_PILGRIM:
    slug: "harvard_pilgrim"
    label: "Harvard Pilgrim"
    carrier_patterns: ["harvard", "pilgrim"]
    is_default: false
    normalization_patterns: ["HARVARD PILGRIM", "HPHC"]
    tic_portal: "https://www.point32health.org/transparency-in-coverage/"
    legal_basis: "45 CFR 147.212"

  UHC:
    slug: "uhc"
    label: "UnitedHealthcare (UHC)"
    carrier_patterns: ["united", "uhc", "unitedhealth"]
    is_default: false
    normalization_patterns: ["UNITED", "UHC"]
    tic_portal: "https://transparency-in-coverage.uhc.com/"
    legal_basis: "45 CFR 147.212"
