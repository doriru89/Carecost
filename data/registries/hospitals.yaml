# Hospital identity registry.
# Key = stable hospital_id used in database and API.
# address_patterns used by CSV import to match provider addresses to hospitals.
# npi = primary type 2 NPI exactly as read from the hospital's own price file (type_2_npi);
#   tests/etl/test_sources.py fails if this and data/etl/sources.yaml disagree with the file.
# facility_type: general_acute (default) | pediatric_acute | cancer_center | rehab
# source_name_aliases = how each data source refers to this hospital.

