[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boston-gi-healthcare-api"
version = "0.1.0"
description = "CareCost API: quote engine, catalog, chat (one FastAPI app, no database)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.8.0",
  "httpx>=0.27.0",
  "email-validator>=2.3.0",
  "pyyaml>=6.0",
  "ijson>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.15.0",
  "pyarrow>=17",
  "openpyxl>=3.1",  # tests/sites reads the DPH xlsx fixtures
]
# ETL only (python -m app.etl); the FastAPI runtime does not need it.
etl = [
  "pyarrow>=17",
  "openpyxl>=3.1",  # app.sites.dph parses the DPH xlsx downloads
  # app.etl.gov.browser: plain headed Chromium for mass.gov (D28); `playwright install chromium`
  "playwright==1.60.0",  # pinned: its Chromium build (1223) is the one `playwright install` fetches
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["ijson.*", "yaml.*", "pyarrow.*"]
ignore_missing_imports = true
