# Backend + frontend tests in containers (no database, D19).
services:
  test-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CARECOST_ALLOW_EXTRACT: "1"  # tests read the committed extract; no real pack here
    command: >
      sh -c "pip install --no-cache-dir pytest pytest-asyncio pyarrow &&
             cd /repo/backend && pytest -q -p no:cacheprovider"
    volumes:
      - ./backend/tests:/repo/backend/tests:ro

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npx vitest run
