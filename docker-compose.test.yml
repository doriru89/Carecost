services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: carecost_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: pg_isready -U postgres
      interval: 2s
      retries: 10

  test-backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "cd /app &&
             alembic upgrade head &&
             pytest --tb=short -q"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/carecost_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/carecost_test
      APP_ENV: test
    depends_on:
      postgres:
        condition: service_healthy

  test-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npx vitest run
