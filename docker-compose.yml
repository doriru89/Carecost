# Local run of the one CareCost API (no database, D19). Keys come from your shell env only.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CARECOST_CORS_ORIGINS: http://localhost:5180,http://127.0.0.1:5180,http://localhost:8080,http://127.0.0.1:8080
