name: ETL (hospital price files)

# Same commands as a local run: python -m app.etl fetch|stage|normalize|build|report.
# Output is uploaded as an artifact; nothing is committed, published or deployed from here.
# Franciscan (2026-10-24): franciscans.childrenshospital.org serves no intermediate TLS
# certificate; data/etl/tls/ carries it (per-host CA), and A3 re-fetched it on 2026-10-25.
# A source that fails a gate is built from its last good copy (pins.yaml, else the baseline
# sha below if the cached store has it), so stage/normalize failures do not stop the build:
# the build step decides. Row counts compare against data/etl/row_count_baseline.json.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"  # monthly, 06:17 UTC on the 3rd

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Restore raw store (content-addressed; newest cache wins)
        uses: actions/cache@v4
        with:
          path: data/raw/store
          key: etl-raw-${{ github.run_id }}
          restore-keys: etl-raw-
      - name: Every care-path code is in the extraction list (R9)
        run: python -m app.etl codes check
      - name: Fetch (one retry per source; a failure keeps the last good copy and alerts, P11)
        id: fetch
        continue-on-error: true
        env:  # P11 alert e-mail; recipient + SMTP only from repo secrets, never committed
          CARECOST_ALERT_EMAIL: ${{ secrets.CARECOST_ALERT_EMAIL }}
          CARECOST_SMTP_HOST: ${{ secrets.CARECOST_SMTP_HOST }}
          CARECOST_SMTP_PORT: ${{ secrets.CARECOST_SMTP_PORT }}
          CARECOST_SMTP_USER: ${{ secrets.CARECOST_SMTP_USER }}
          CARECOST_SMTP_PASSWORD: ${{ secrets.CARECOST_SMTP_PASSWORD }}
          CARECOST_SMTP_FROM: ${{ secrets.CARECOST_SMTP_FROM }}
        run: python -m app.etl fetch
      - name: Stage
        id: stage
        continue-on-error: true
        run: python -m app.etl stage
      - name: Normalize
        id: normalize
        continue-on-error: true
        run: python -m app.etl normalize
      - name: Build (quality gates; per-source last-good fallback)
        run: python -m app.etl build --baseline-manifest ../data/etl/row_count_baseline.json
      - name: Report
        if: always()
        run: python -m app.etl report
      - name: Upload build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-build
          path: |
            data/build/*/manifest.json
            data/build/*/gates.json
            data/build/*/coverage.md
            data/build/*/coverage.csv
            data/build/*/rate_row.sqlite
      - name: Fail if any fetch / stage / normalize failed
        if: steps.fetch.outcome == 'failure' || steps.stage.outcome == 'failure' || steps.normalize.outcome == 'failure'
        run: |
          echo "::error::a source failed before build (it shipped from its last good copy, or the build failed)"
          exit 1
