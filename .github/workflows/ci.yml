name: CI

on:
  push:
    branches: [main, master, austin, staging]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/
      - name: Ruff format check
        run: ruff format --check backend/

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pytest (no database; quote tests run on the committed extract)
        run: uv run --frozen --extra dev pytest -q -p no:cacheprovider
      - name: Contracts are current (JSON Schemas + TS types)
        run: |
          uv run --frozen python -m app.api_contracts --check
      - name: Runtime imports no pyarrow and no legacy module
        run: |
          uv run --frozen python - <<'PY'
          import sys
          import app.server  # noqa: F401
          bad = [m for m in sys.modules if m == "pyarrow" or m.split(".")[:2] in (
              ["app", "routes"], ["app", "services"], ["app", "db"], ["app", "modules"])]
          assert not bad, bad
          PY

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Contract exhaustiveness locks (tsc on generated types + src/contracts)
        run: npm run typecheck:contracts
      - name: Test
        run: npx vitest run

  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (runtime deps only)
        run: pip install ./backend
      - name: Registry freshness check (generated files match YAML)
        run: python scripts/generate_frontend_registry.py --check
      - name: Registry cross-validation (Pydantic)
        env:
          PYTHONPATH: backend
        run: python -c "from app.registries import validate_all_registries; validate_all_registries()"
      - name: Docker build API image (pack from the committed extract)
        run: docker build -t carecost-api:ci .
      - name: Docker startup smoke test
        run: |
          docker run -d --name api -p 8000:8000 carecost-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
          python3 - <<'PY'
          import json, urllib.request
          d = json.load(open("contracts/fixtures/quote_request_cash_shoulder.json"))
          d.pop("_fixture"); d.pop("_schema")
          r = urllib.request.urlopen(urllib.request.Request(
              "http://127.0.0.1:8000/api/quote", json.dumps(d).encode(),
              {"content-type": "application/json"}))
          assert r.status == 200 and json.load(r)["sites"]
          PY
          docker rm -f api
