name: CI

on:
  push:
    branches: [main, master, austin, staging]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/
      - name: Ruff format check
        run: ruff format --check backend/

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carecost_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Pytest + coverage
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/carecost_test
        run: |
          pytest \
            --cov=app.config \
            --cov=app.services.intake \
            --cov=app.services.jwt_auth \
            --cov=app.services.plan_rules \
            --cov=app.services.pricing \
            --cov=app.services.safety_crisis \
            --cov=app.services.scenario_to_bundle \
            --cov-report=term-missing \
            --cov-report=json:coverage-backend.json \
            --cov-fail-under=75
      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage-backend.json

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Test + coverage
        run: npm run test:coverage
      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/coverage-summary.json

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Backend boundary checks (strict)
        run: python scripts/check_backend_boundaries.py --strict
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend boundary lint (strict)
        run: |
          cd frontend
          npm ci
          npx eslint "src/features/**/*.{ts,tsx}" --max-warnings=0

  registry-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Registry freshness check (generated files match YAML)
        run: python scripts/generate_frontend_registry.py --check
      - name: Registry cross-validation (Pydantic)
        env:
          PYTHONPATH: backend
        run: python -c "from app.registries import validate_all_registries; validate_all_registries()"
      - name: Production requirements smoke
        run: |
          cd backend
          python -m venv .venv-prod
          .venv-prod/bin/pip install -r requirements.txt
          .venv-prod/bin/python -c "import app.main"
      - name: Docker build API image
        run: docker build -t carecost-api:ci .
      - name: Docker startup smoke test
        run: docker run --rm carecost-api:ci python -c "from app.main import app; print('startup OK')"

  quality-artifact:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate quality status JSON
        run: |
          python scripts/generate_quality_status.py \
            --status=passed \
            --sha=${{ github.sha }} \
            --backend-coverage=backend/coverage-backend.json \
            --frontend-coverage=frontend/coverage/coverage-summary.json \
            --output=test-results/quality-status.json
      - name: Coverage thresholds (strict)
        run: |
          python scripts/check_coverage_thresholds.py \
            --backend-json=backend/coverage-backend.json \
            --frontend-json=frontend/coverage/coverage-summary.json \
            --threshold=75 \
            --strict
      - name: Upload quality status artifact
        uses: actions/upload-artifact@v4
        with:
          name: quality-status
          path: test-results/quality-status.json
