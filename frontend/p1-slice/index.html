<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P1 receipt</title>
<style>
  /* P1: plain on purpose. Stream D designs the real receipt (D8 gradient, split view). */
  :root { --fg: #111; --bg: #fff; --muted: #555; --line: #ccc; --warn: #8a4b00; --gap: #fff3e0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #eee; --bg: #161616; --muted: #aaa; --line: #444; --warn: #ffb74d; --gap: #2b2116; }
  }
  body { font: 14px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; padding: 16px; max-width: 980px; }
  h1 { font-size: 18px; } h2 { font-size: 16px; margin: 24px 0 4px; } h3 { font-size: 14px; margin: 12px 0 4px; }
  table { border-collapse: collapse; width: 100%; } td, th { border-top: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .muted, small { color: var(--muted); } .gap { background: var(--gap); } .warn { color: var(--warn); }
  .total { font-size: 20px; font-weight: 700; } .chip { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; }
  .tier-certain td:first-child { border-left: 6px solid var(--fg); } .tier-likely td:first-child { border-left: 6px solid var(--muted); }
  .tier-possible td:first-child { border-left: 6px dashed var(--line); } .tier-not_in_public_data td:first-child { border-left: 6px solid var(--warn); }
  .ai { outline: 1px dashed var(--muted); } code { font-size: 12px; }
  .controls label { margin-right: 12px; } #err { color: var(--warn); white-space: pre-wrap; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<h1>CareCost P1 receipt (thin real slice)</h1>
<div class="controls">
  <label><input type="radio" name="pay" value="bcbs" checked> BCBS MA HMO</label>
  <label><input type="radio" name="pay" value="cash"> Cash / no insurance</label>
  <label>API <input id="api" value="http://127.0.0.1:8100" size="24"></label>
  <button id="go">Get quote</button>
</div>
<p class="muted">Care path <code>shoulder_chronic_clicking_v1</code>, answers Q1 shoulder, Q2 no_injury, Q14 by payment.</p>
<p id="diag"><b>copy.not_a_diagnosis</b> <span class="muted">(copy text is stream D's; meaning per D33:)</span> These are common causes, not a diagnosis. A doctor needs to examine you to confirm.</p>
<div id="err"></div>
<div id="out"></div>
<script>
const REQ = {
  bcbs: { payment: { kind: "insurance", payer_id: "BCBS_MA", product: "HMO", network: null },
          care_path_id: "shoulder_chronic_clicking_v1",
          answers: { Q1: ["shoulder"], Q2: ["no_injury"], Q14: ["hmo_referral_required"] },
          service_codes: [], picked_by: "person", site_ids: null },
  cash: { payment: { kind: "cash" }, care_path_id: "shoulder_chronic_clicking_v1",
          answers: { Q1: ["shoulder"], Q2: ["no_injury"], Q14: ["cash"] },
          service_codes: [], picked_by: "person", site_ids: null },
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (n) => "$" + Number(n).toFixed(2);
const money = (m) => m.low === m.high ? usd(m.low) : `${usd(m.low)} – ${usd(m.high)}`;

function freshLabel(f) {
  if (f.stale_on_our_side) return `<span class="warn">Stale on our side</span> (our last fetch ${esc(f.fetched_at)}, due ${esc(f.our_refresh_due)})`;
  if (f.late_to_refresh) return `<span class="warn">Late to refresh</span> (publisher dated ${esc(f.last_updated)}, was due ${esc(f.expected_by)})`;
  return `Current (publisher dated ${esc(f.last_updated ?? "no date")}, next due ${esc(f.expected_by ?? "none")}; we fetched ${esc(f.fetched_at)})`;
}

function chip(resp, prov) {
  const s = resp.sources[prov.source_id];
  return `<span class="chip" title="${esc(s.publisher)} · ${esc(prov.source_file)} · row ${esc(prov.row_ref)}">${esc(s.source_kind)} · ${esc(s.publisher)}</span>`;
}

function cell(resp, c) {
  if (c === null) return "not offered here";
  switch (c.kind) {
    case "money": return `<b>${money(c)}</b> <small>${esc(c.basis)}</small><br>${chip(resp, c.prov)}<br><small><code>${esc(c.prov.row_ref)}</code></small>`;
    case "not_published": return `<b>Not published</b> (<code>gap.not_published</code>): ${esc(c.what)}<br><small>Ask: ${esc(c.ask)} · searched ${esc(c.searched.source_id)}</small>`;
    case "not_loaded": return `<b>Not loaded yet</b> (<code>gap.not_loaded</code>): ${esc(c.what)}`;
    case "no_source": return `<b>No public source</b> (<code>gap.no_source</code>): ${esc(c.what)}<br><small>Ask: ${esc(c.ask)}</small>`;
    case "percent_only": return `<b>Only a percentage</b> (<code>gap.percent_only</code>): ${esc(c.pct)}% of ${esc(c.of)}`;
    case "conflict": return `<b>Sources disagree</b> (<code>gap.conflict</code>): ${money(c.a)} vs ${money(c.b)}`;
  }
  return esc(JSON.stringify(c));
}

function render(resp) {
  const parts = [];
  parts.push(`<p>as_of <b>${esc(resp.as_of)}</b> · build <code>${esc(resp.data_version.build_id)}</code> · TiC <code>${esc(resp.data_version.tic_release)}</code> · notices: ${resp.notices.map((n) => `<code>${esc(n)}</code>`).join(" ") || "none"}</p>`);
  if (resp.care_path.review_status !== "approved") parts.push(`<p class="warn">Draft care path (review: ${esc(resp.care_path.review_status)})</p>`);
  for (const sq of resp.sites) {
    const t = sq.receipt.totals;
    parts.push(`<h2>${esc(sq.site.name)}</h2><div class="muted">${esc(sq.site.address_line)} · billed as <code>${esc(sq.site.billing_type)}</code> · price source ${esc(resp.sources[sq.site.price_source_id].publisher)}</div>`);
    parts.push(`<div class="total">TOTAL (likely) ${t.likely ? money(t.likely) : "no number"}</div>`);
    parts.push(`<div class="muted">${t.complete ? "complete" : `<span class="warn">not complete</span>: the total is a floor`} · missing ${t.missing} · you pay: <code>${esc(t.you_pay.note_key)}</code>${t.you_pay.portal_url ? ` · <a href="${esc(t.you_pay.portal_url)}">${esc(t.you_pay.portal_label)}</a>` : ""}${t.likely && t.likely.includes_late_source ? " · includes a late source" : ""}${t.likely && t.likely.includes_stale_source ? " · includes a source stale on our side" : ""}</div>`);
    parts.push(`<div class="table-wrap"><table><tr><th>Line</th><th>Tier</th><th class="amt">Amount or gap · source</th><th>In total</th></tr>`);
    const excluded = Object.fromEntries(t.excluded.map((e) => [e.line_id, e.reason]));
    for (const ln of sq.receipt.lines) {
      const fee = ln.doctor_fee ? `<br><small>doctor fee: <code>${esc(ln.doctor_fee.explanation_key)}</code>${ln.doctor_fee.group_name ? " · " + esc(ln.doctor_fee.group_name) : ""}</small>` : "";
      const list = ln.list_price ? `<br><small>list price (never summed): ${money(ln.list_price)}</small>` : "";
      parts.push(`<tr class="tier-${esc(ln.tier)} ${ln.ai_suggested ? "ai" : ""} ${ln.tier === "not_in_public_data" ? "gap" : ""}">
        <td>${ln.ai_suggested ? "✦ AI-suggested · " : ""}<b>${esc(ln.plain_name)}</b><br><small>${esc(ln.technical_name)} · <code>${esc(ln.codes.join(","))}${ln.modifier ? "-" + esc(ln.modifier) : ""}</code>${ln.unit !== "once" ? " · " + esc(ln.unit) : ""}</small><br><span class="muted">Why: ${esc(ln.why)}</span>${fee}</td>
        <td>${esc(ln.tier)}<br><small>basis: ${esc(ln.tier_basis)}</small></td>
        <td class="amt">${cell(resp, ln.cell)}${list}</td>
        <td>${ln.in_total ? "yes" : `no <small>(${esc(excluded[ln.line_id])})</small>`}</td></tr>`);
    }
    parts.push(`</table></div>`);
    for (const o of sq.other_payers) {
      parts.push(`<h3>Other insurers, same X-ray here</h3><ul>${o.points.map((p) => `<li>${esc(p.label)}: ${money(p.money)}</li>`).join("")}${o.cash ? `<li>Cash: ${money(o.cash)}</li>` : ""}</ul>`);
    }
  }
  if (resp.sites_without_service.length) parts.push(`<p class="muted">Not shown for this payment: ${resp.sites_without_service.map(esc).join(", ")} (no loaded price source for it)</p>`);
  parts.push(`<h2>Sources &amp; dates</h2><ul>${Object.entries(resp.sources).map(([sid, s]) => `<li><code>${esc(sid)}</code> ${esc(s.publisher)}: ${freshLabel(s.freshness)}</li>`).join("")}</ul>`);
  document.getElementById("out").innerHTML = parts.join("\n");
}

async function go() {
  const which = document.querySelector("input[name=pay]:checked").value;
  document.getElementById("err").textContent = "";
  try {
    const r = await fetch(document.getElementById("api").value + "/api/quote", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(REQ[which]),
    });
    const body = await r.json();
    if (!r.ok) throw new Error(`${r.status}: ${JSON.stringify(body.detail ?? body)}`);
    render(body);
  } catch (e) {
    document.getElementById("err").textContent = String(e);
  }
}
document.getElementById("go").addEventListener("click", go);
document.querySelectorAll("input[name=pay]").forEach((el) => el.addEventListener("change", go));
go();
</script>
</body>
</html>
